[tox]
envlist =
    linters
    py

[coverage:run]
branch = True
omit =
    */__init__.py

source =
    adventofcode
    adventofcode2016
    adventofcode2018
    adventofcode2019
    adventofcode2020
    adventofcode2021
    adventofcode2022
    adventofcode2023
    adventofcode2024
    adventofcode2025
    tests

[coverage:report]
fail_under = 90
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover

    # Don't complain if tests don't hit defensive assertion code:
    raise NotImplementedError

[testenv]
runner = uv-venv-lock-runner

deps =
    uv
    pytest
    pytest-cov
    pytest-xdist

commands =
    pytest {posargs} -n auto

[testenv:ruff]
skip_install = true
description = Lint and check formatting with ruff
deps = ruff
commands =
    ruff check {posargs:src/ tests/}
    ruff format --check --diff {posargs:src/ tests/}

[testenv:mypy]
skip_install = true
description = type check ourselves
deps =
    mypy
    lxml
    types-requests
    attrs
    numpy
commands =
    python -m mypy --config-file mypy.ini src/

[testenv:bandit]
skip_install = true
description = Find common security issues in Python code
deps = bandit
commands =
    bandit -c pyproject.toml -r src/ tests/

# Combines all linters in one, fast, env
[testenv:linters]
skip_install = true
deps =
    {[testenv:ruff]deps}
    {[testenv:bandit]deps}
    #{[testenv:mypy]deps}
commands =
    {[testenv:ruff]commands}
    {[testenv:bandit]commands}
    #{[testenv:mypy]commands}
